[ids]
*

[global]
default_layout = colemak_my_dh

[main]
# Hold: momentary "caps" layer
# Tap: Caps Lock
capslock = overload(caps, capslock)

# Sticky shift (optional)
# shift = oneshot(shift)

# Numpad decimal: force dot instead of comma (Norwegian default)
kpdot = .

[caps]
# Layer toggle + quick AltGr symbols
# (AltGr number row follows Norwegian layout expectations)
c = setlayout(colemak_my_dh)
d = G-7
e = G-8
f = G-0
q = setlayout(main)
r = G-9

[colemak_my_dh:layout]
# Colemak-DH variant on a Norwegian ISO keyboard.
# Norwegian key legends used in this file:
# ; key = Ø
# ' key = Æ
# [ key = Å
# 102nd key = the extra ISO key (< > |) next to left Shift
' = [
102nd = z
; = o
[ = '
b = 102nd
c = d
d = s
e = f
f = t
i = u
j = n
k = e
l = i
n = k
o = y
p = ;
r = p
s = r
t = b
u = l
x = c
y = j
z = x

[control]
# Keep Ctrl shortcuts in QWERTY positions
b = C-b
c = C-c
d = C-d
e = C-e
f = C-f
i = C-i
j = C-j
k = C-k
l = C-l
n = C-n
o = C-o
p = C-p
r = C-r
s = C-s
t = C-t
u = C-u
x = C-x
y = C-y
z = C-z

[alt]
# Keep Alt shortcuts in QWERTY positions
b = A-b
c = A-c
d = A-d
e = A-e
f = A-f
i = A-i
j = A-j
k = A-k
l = A-l
n = A-n
o = A-o
p = A-p
r = A-r
s = A-s
t = A-t
u = A-u
x = A-x
y = A-y
z = A-z

[altgr]
# Keep AltGr combos in QWERTY positions
b = G-b
c = G-c
d = G-d
e = G-e
f = G-f
i = G-i
j = G-j
k = G-k
l = G-l
n = G-n
o = G-o
p = G-p
r = G-r
s = G-s
t = G-t
u = G-u
x = G-x
y = G-y
z = G-z

[meta]
# Meta in keyd is typically Super/Win on Linux.
b = M-b
c = M-c
d = M-d
e = M-e
f = M-f
i = M-i
j = M-j
k = M-k
l = M-l
n = M-n
o = M-o
p = M-p
r = M-r
s = M-s
t = M-t
u = M-u
x = M-x
y = M-y
z = M-z
